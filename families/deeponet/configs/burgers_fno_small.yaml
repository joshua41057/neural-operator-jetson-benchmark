experiment:
  name: burgers_fno_small
  seed: 0
  deterministic: false
  output_dir: checkpoints

data:
  dataset: burgers
  path: data/raw/burgers_data_R10.mat
  split_path: splits/burgers_split.json
  input_key: a
  output_key: u
  resolution: [2048]
  add_coords: true
  batch_size: 16
  eval_batch_size: 16
  num_workers: 4
  pin_memory: true

model:
  family: fno
  spatial_dim: 1
  hidden_channels: 32
  projection_channels: 64
  n_layers: 4
  modes: [16]
  padding: [16]

train:
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  min_lr: 1.0e-5
  epochs: 220
  early_stopping_patience: 35
  amp: false
  grad_clip: 1.0
  step_size: 50
  gamma: 0.5