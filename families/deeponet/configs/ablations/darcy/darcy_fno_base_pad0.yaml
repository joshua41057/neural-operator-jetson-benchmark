experiment:
  name: darcy_fno_base_pad0
  seed: 0
  deterministic: false
  output_dir: checkpoints

data:
  dataset: darcy
  train_path: data/raw/piececonst_r421_N1024_smooth1.mat
  test_path: data/raw/piececonst_r421_N1024_smooth2.mat
  split_path: splits/darcy_smooth1_split.json
  input_key: Kcoeff
  output_key: sol
  resolution: [141, 141]
  add_coords: true
  batch_size: 4
  eval_batch_size: 4
  num_workers: 4
  pin_memory: true

model:
  family: fno
  spatial_dim: 2
  hidden_channels: 40
  projection_channels: 96
  n_layers: 4
  modes: [16, 16]
  padding: [0, 0]

train:
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  min_lr: 1.0e-5
  epochs: 300
  early_stopping_patience: 50
  amp: false
  grad_clip: 1.0
  step_size: 50
  gamma: 0.5