experiment:
  name: darcy_fno_small
  seed: 0
  deterministic: false
  output_dir: checkpoints

data:
  dataset: darcy
  train_path: data/raw/piececonst_r421_N1024_smooth1.mat
  test_path: data/raw/piececonst_r421_N1024_smooth2.mat
  split_path: splits/darcy_smooth1_split.json
  input_key: Kcoeff
  output_key: sol
  resolution: [141, 141]
  add_coords: true
  batch_size: 8
  eval_batch_size: 8
  num_workers: 4
  pin_memory: true

model:
  family: fno
  spatial_dim: 2
  hidden_channels: 24
  projection_channels: 64
  n_layers: 4
  modes: [12, 12]
  padding: [8, 8]

train:
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  min_lr: 1.0e-5
  epochs: 260
  early_stopping_patience: 45
  amp: false
  grad_clip: 1.0
  step_size: 50
  gamma: 0.5